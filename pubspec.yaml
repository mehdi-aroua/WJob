version: 1.0.0+1

environment:
  sdk: ^3.5.3

dependencies:
  intl_phone_number_input: ^0.7.4
  drag_and_drop_lists: ^0.4.2
  # permission_handler: ^11.3.1
  # flutter_barcode_scanner: ^2.0.0
  # qr_code_scanner: ^1.0.0
  mobile_scanner: ^6.0.3
  url_launcher: ^6.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0
  cupertino_icons: ^1.0.8
  otp_pin_field: ^1.3.2
  http: ^1.3.0
  get: ^4.6.6
  file_picker: ^8.1.7
  flutter_map: ^8.1.0
  latlong2: ^0.9.1
  location: ^8.0.0
  geolocator: ^13.0.2
  flutter_polyline_points: ^2.0.0
  provider: ^6.1.2
  flutter_launcher_icons: ^0.14.3
  mapbox_maps_flutter: ^2.5.2
  flutter_dotenv: ^5.2.1
  flutter_map_tile_caching: ^10.1.0
  socket_io_client: ^3.0.2
  slide_to_act: ^2.0.1
  flutter_local_notifications: ^19.0.0
  geocoding: ^3.0.0
  path: ^1.9.1
  http_parser: ^4.1.2
  flutter_image_compress: ^2.4.0
  country_picker: ^2.0.21
  shared_preferences: ^2.5.3
  flutter_calendar_carousel: ^2.4.4
  pdf: ^3.11.3
  permission_handler: ^12.0.0+1
  path_provider: ^2.1.5
  printing: ^5.14.2
  device_info_plus: ^11.4.0
  app_settings: ^5.1.1
  share_plus: ^11.0.0
  open_file: ^3.5.10


dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.24.9
  image_picker: ^1.1.2
  flutter_lints: ^4.0.0
  mockito: ^5.4.4
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - lib/lang/en.json
    - lib/lang/ar.json
    - lib/lang/fr.json
    - assets/Icone/
    - assets/Logo/
    - assets/Picture/01/
    - assets/Picture/02/
    - assets/Searching/


  fonts:
    - family: Inter
      fonts:
        - asset: assets/font/Inter/Inter/Inter-VariableFont_slnt,wght.ttf
        - asset: assets/font/Inter/Inter/static/Inter-Black.ttf
        - asset: assets/font/Inter/Inter/static/Inter-Bold.ttf
        - asset: assets/font/Inter/Inter/static/Inter-ExtraBold.ttf
        - asset: assets/font/Inter/Inter/static/Inter-ExtraLight.ttf
        - asset: assets/font/Inter/Inter/static/Inter-Light.ttf
        - asset: assets/font/Inter/Inter/static/Inter-Medium.ttf
        - asset: assets/font/Inter/Inter/static/Inter-Regular.ttf
        - asset: assets/font/Inter/Inter/static/Inter-SemiBold.ttf
        - asset: assets/font/Inter/Inter/static/Inter-Thin.ttf
    - family: Lorin
      fonts:
        - asset: assets/font/Lorin/lorin/OTF/Lorin-Bold.otf
        - asset: assets/font/Lorin/lorin/OTF/Lorin-ExtraBold.otf
        - asset: assets/font/Lorin/lorin/OTF/Lorin-Light.otf
        - asset: assets/font/Lorin/lorin/OTF/Lorin-Regular.otf
        - asset: assets/font/Lorin/lorin/TTF/Lorin-Bold.ttf
        - asset: assets/font/Lorin/lorin/TTF/Lorin-ExtraBold.ttf
        - asset: assets/font/Lorin/lorin/TTF/Lorin-Light.ttf
        - asset: assets/font/Lorin/lorin/TTF/Lorin-Regular.ttf
flutter_intl:
  enabled: true
